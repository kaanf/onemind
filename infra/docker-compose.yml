# Local development services (ADR 0008).
# Usage: docker compose -f infra/docker-compose.yml up -d
name: onemind

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: onemind
      POSTGRES_USER: onemind
      POSTGRES_PASSWORD: onemind
    ports:
      - "127.0.0.1:5433:5432"   # host 5433: a native PostgreSQL may already use 5432; localhost only
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U onemind -d onemind"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Catches sign-in emails locally: SMTP on 1025 (the backend's default), web UI on http://localhost:8025.
  mailpit:
    image: axllent/mailpit:v1.33.1
    ports:
      # localhost only: the inbox has no login and holds live sign-in codes.
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

volumes:
  postgres-data:
