# Local development services (ADR 0008).
# Usage: docker compose -f infra/docker-compose.yml up -d
name: onemind

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: onemind
      POSTGRES_USER: onemind
      POSTGRES_PASSWORD: onemind
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U onemind -d onemind"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
