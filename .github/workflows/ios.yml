# iOS build (ADR 0012 §6): merges to dev and main, nightly, and on demand; on PRs only when this
# file changes, so edits to it are tested before merge. Not a required check.
# The repo is public, so macOS runner minutes are free.
# GitHub runs `schedule` only from the default branch (main), so the nightly build starts once this
# file is on main; it then builds dev.
name: iOS

on:
  pull_request:
    branches: [dev, main]
    paths:
      - .github/workflows/ios.yml
  push:
    branches: [dev, main]
    paths:
      - mobile/**
      - docs/api/**
      - .github/workflows/ios.yml
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  ios:
    name: iOS simulator build
    runs-on: macos-26
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'schedule' && 'dev' || '' }}

      # core:api bundles the split spec with Redocly (npx) before generating models.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26

      # The Xcode build phase picks JDK 21 with `java_home -v 21`; the runner image registers its
      # preinstalled JDK 21 there, so no setup-java.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic
          cache-read-only: ${{ github.event_name != 'push' }}

      # Runs :composeApp:embedAndSignAppleFrameworkForXcode as a build phase, then compiles the app.
      - run: >-
          xcodebuild -project iosApp/iosApp.xcodeproj -scheme iosApp -configuration Debug
          -sdk iphonesimulator -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO build
