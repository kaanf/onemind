# CI gates from ADR 0012 §6 (backend, mobile, iOS framework) and ADR 0001 (API spec). The full
# xcodebuild of the iOS app is in ios.yml.
# On a PR each job runs only when its paths changed (a workflow-level `paths` filter would leave
# required checks pending). "CI result" is the only required check: it fails when any job fails or
# is cancelled, or is skipped although its area changed, so a skipped job can't pass as green.
name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.diff.outputs.backend }}
      api: ${{ steps.diff.outputs.api }}
      mobile: ${{ steps.diff.outputs.mobile }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      # On a PR, HEAD is the merge commit and HEAD^1 the base branch, so this diff is the PR's change.
      # Pushes and manual runs check everything. The spec feeds backend and mobile codegen; the root
      # .editorconfig feeds both ktlint setups.
      - id: diff
        run: |
          changed() {
            if [ "${{ github.event_name }}" != "pull_request" ] ||
               ! git diff --quiet HEAD^1 HEAD -- "$@" .github/workflows/ci.yml; then
              echo true
            else
              echo false
            fi
          }
          {
            echo "backend=$(changed backend docs/api .editorconfig)"
            echo "api=$(changed docs/api)"
            echo "mobile=$(changed mobile docs/api .editorconfig)"
          } | tee -a "$GITHUB_OUTPUT"

  # `!= 'false'` instead of `== 'true'`: if `changes` fails, the jobs run rather than skip as green.
  backend:
    name: Backend build and test
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.backend != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 25

      # Basic caching is the MIT-licensed provider (plain actions/cache); also validates the wrapper.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic
          cache-read-only: ${{ github.ref != 'refs/heads/dev' && github.ref != 'refs/heads/main' }}

      # build = OpenAPI + jOOQ codegen (Testcontainers), compile, ktlint, unit + integration tests,
      # Spring Modulith boundary test. Docker is preinstalled on ubuntu runners.
      - run: ./gradlew build

      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-test-reports
          path: backend/build/reports/
          retention-days: 7

  api:
    name: API spec lint and breaking changes
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.api != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      REDOCLY_CLI_VERSION: 2.82.0
      OASDIFF_VERSION: 1.39.0
      OASDIFF_SHA256: 71a85930728f367a2086077b7ae1411319421549d18473a3e8258b6451520433
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26

      - name: Lint spec (Redocly)
        run: >-
          npx --yes @redocly/cli@${REDOCLY_CLI_VERSION} lint
          --config docs/api/redocly.yaml --format github-actions docs/api/openapi.yaml

      # The money rule must flag exactly the fixture's violations, no more, no fewer (AGENTS.md rule 5).
      - name: Prove the money lint rule bites
        run: |
          out=$(npx --yes @redocly/cli@${REDOCLY_CLI_VERSION} lint --config docs/api/redocly.yaml --format json docs/api/lint/money-as-number.yaml || true)
          diff <(jq -r '[.problems[] | select(.ruleId == "onemind/money-minor-units") | .location[0].pointer] | sort | .[]' <<<"$out") docs/api/lint/money-as-number.expected

      # ADR 0001: compare against the released contract on main. Skipped until main has a spec.
      # Fails on warnings too (oasdiff rates removed request fields/params as warnings; v1 forbids
      # them). docs/api/oasdiff-levels.txt allows new response enum values (v1 permits them) and
      # makes removed ones errors, so an enum value rename fails.
      - name: Check breaking changes against main (oasdiff)
        run: |
          git fetch --no-tags --depth=1 origin main
          if ! git cat-file -e FETCH_HEAD:docs/api/openapi.yaml 2>/dev/null; then
            echo "::notice title=oasdiff::main has no docs/api/openapi.yaml yet; breaking-change check skipped."
            exit 0
          fi
          base="$RUNNER_TEMP/base"
          mkdir -p "$base"
          git archive FETCH_HEAD docs/api | tar -x -C "$base"

          archive="oasdiff_${OASDIFF_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/oasdiff/oasdiff/releases/download/v${OASDIFF_VERSION}/$archive"
          echo "${OASDIFF_SHA256}  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" oasdiff

          "$RUNNER_TEMP/oasdiff" breaking --fail-on WARN --format githubactions \
            --severity-levels docs/api/oasdiff-levels.txt \
            "$base/docs/api/openapi.yaml" docs/api/openapi.yaml

  mobile:
    name: Mobile tests and Android build
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.mobile != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 21

      # core:api bundles the split spec with Redocly (npx) before generating models.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic
          cache-read-only: ${{ github.ref != 'refs/heads/dev' && github.ref != 'refs/heads/main' }}

      # testAndroidHostTest runs every module's commonTest on the JVM; :core:konsist:test runs the
      # architecture, money and clock guards. The Android SDK is preinstalled on ubuntu runners (ANDROID_HOME).
      - run: ./gradlew ktlintCheck testAndroidHostTest :core:konsist:test :androidApp:assembleDebug

      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mobile-test-reports
          path: mobile/**/build/reports/
          retention-days: 7

  # Compiles and links the shared framework for the simulator, which catches iOS-only Kotlin errors
  # (iosMain, expect/actual, cinterop) on every mobile PR in a fraction of the full xcodebuild time,
  # then runs the iOS-only tests on the simulator.
  ios-compile:
    name: iOS framework compile
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.mobile != 'false' }}
    runs-on: macos-26
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 21

      # core:api bundles the split spec with Redocly (npx) before generating models.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic
          cache-read-only: ${{ github.ref != 'refs/heads/dev' && github.ref != 'refs/heads/main' }}

      - run: ./gradlew :composeApp:linkDebugFrameworkIosSimulatorArm64

      # Tests on the iOS simulator: the Keychain session store (`core/data/src/iosTest`) can't run on the
      # JVM, and the money formatter (`core/presentation`) uses NSNumberFormatter on iOS, so its common
      # tests must pass there too. Kotlin/Native's default `simctl spawn --standalone` has no Keychain, so a
      # simulator is booted first and the tests run inside it (`onemind.iosTestDevice`, core/data).
      - name: Boot an iOS simulator
        id: simulator
        run: |
          udid=$(xcrun simctl list devices available --json \
            | jq -r '[.devices | to_entries[] | select(.key | contains("iOS")) | .value[] | select(.name | startswith("iPhone"))][0].udid')
          test -n "$udid" && test "$udid" != "null"
          xcrun simctl boot "$udid" || true
          xcrun simctl bootstatus "$udid" -b
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      # core:presentation's commonTest also runs on iOS: the money formatter uses NSNumberFormatter there,
      # and its exact-string tests must agree with the JVM's NumberFormat.
      - run: >-
          ./gradlew :core:data:iosSimulatorArm64Test :core:presentation:iosSimulatorArm64Test
          -Ponemind.iosTestDevice=${{ steps.simulator.outputs.udid }}

      # Gradle reports a binary the simulator refused to launch as "1 test, 1 skipped", which would pass.
      # The iOS suites below must have run: at least N tests each, none skipped, none failed.
      - name: Check the iOS-only tests ran
        run: |
          python3 - <<'PY'
          import glob, sys, xml.etree.ElementTree as ET
          # Kotlin/Native prefixes the suite with the target: TEST-iosSimulatorArm64Test.com.onemind….xml
          suites = {
              "core/data": ("IosSecureSessionStoreTest", 4),
              "core/presentation": ("MoneyFormatTest", 10),
          }
          problems = []
          for module, (name, minimum) in suites.items():
              paths = glob.glob(f"{module}/build/test-results/iosSimulatorArm64Test/TEST-*{name}.xml")
              if len(paths) != 1:
                  problems.append(f"{name} did not run: expected one result file, found {paths}")
                  continue
              try:
                  suite = ET.parse(paths[0]).getroot()
              except ET.ParseError as e:
                  problems.append(f"{name} result unreadable: {e}")
                  continue
              tests, skipped = int(suite.get("tests", 0)), int(suite.get("skipped", 0))
              failed = int(suite.get("failures", 0)) + int(suite.get("errors", 0))
              print(f"{name}: {tests} tests, {failed} failed, {skipped} skipped")
              if tests < minimum or skipped or failed:
                  problems.append(f"{name}: expected at least {minimum} tests, all executed and passed")
          if problems:
              sys.exit("\n".join(problems))
          PY

      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-test-reports
          path: mobile/**/build/reports/
          retention-days: 7

  # The single required check. Each job maps to the `changes` output that gates it; a job missing
  # from `needs` or from the map fails this check, so new jobs can't slip past it.
  ci-result:
    name: CI result
    needs: [changes, backend, api, mobile, ios-compile]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/workflows/ci.yml
          sparse-checkout-cone-mode: false

      - env:
          NEEDS: ${{ toJSON(needs) }}
          EVENT: ${{ github.event_name }}
        run: |
          area() {
            case "$1" in
              backend) echo backend ;;
              api) echo api ;;
              mobile | ios-compile) echo mobile ;;
            esac
          }
          fail=0
          error() { echo "::error title=CI result::$1"; fail=1; }

          # yq is preinstalled on ubuntu runners.
          jobs=$(yq '.jobs | keys | .[]' .github/workflows/ci.yml | grep -vx ci-result)
          [ -n "$jobs" ] || error "No jobs found in ci.yml."
          for job in $jobs; do
            jq -e --arg j "$job" 'has($j)' <<<"$NEEDS" >/dev/null || error "$job is missing from ci-result needs."
            [ "$job" = changes ] || [ -n "$(area "$job")" ] || error "$job has no area in ci-result."
          done

          result=$(jq -r '.changes.result' <<<"$NEEDS")
          [ "$result" = success ] || error "changes: $result"

          for job in $(jq -r 'keys[] | select(. != "changes")' <<<"$NEEDS"); do
            result=$(jq -r --arg j "$job" '.[$j].result' <<<"$NEEDS")
            changed=$(jq -r --arg a "$(area "$job")" '.changes.outputs[$a] // ""' <<<"$NEEDS")
            echo "$job: $result ($(area "$job") changed: ${changed:-unknown})"
            case "$result" in
              success) ;;
              skipped)
                # On push and manual runs every job must run; on a PR only unchanged areas may skip.
                if [ "$EVENT" != pull_request ] || [ "$changed" != false ]; then
                  error "$job was skipped although its area changed."
                fi
                ;;
              *) error "$job: $result" ;;
            esac
          done
          exit "$fail"
