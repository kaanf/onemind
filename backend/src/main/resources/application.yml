spring:
  application:
    name: onemind-backend
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5433/onemind}
    username: ${DATABASE_USERNAME:onemind}
    password: ${DATABASE_PASSWORD:onemind}
  flyway:
    locations: classpath:db/migration
  jooq:
    sql-dialect: postgres

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
