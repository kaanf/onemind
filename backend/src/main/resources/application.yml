spring:
  application:
    name: onemind-backend
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5433/onemind}
    username: ${DATABASE_USERNAME:onemind}
    password: ${DATABASE_PASSWORD:onemind}
  flyway:
    locations: classpath:db/migration
    # History table lives in platform; module schemas are created by their migrations.
    default-schema: platform
    schemas: platform
  jooq:
    sql-dialect: postgres
  # SMTP behind EmailSender; Mailpit locally (infra/docker-compose.yml). Provider: docs/OPEN_QUESTIONS.md.
  mail:
    # 127.0.0.1, not localhost: on Colima, ::1 accepts the connection but never sends the SMTP greeting.
    host: ${MAIL_HOST:127.0.0.1}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    # 10 s: Colima's port forwarder delays the SMTP greeting by ~6 s locally.
    properties:
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000
  modulith:
    events:
      jdbc:
        # Flyway owns the DDL (V005).
        schema: platform
        schema-initialization:
          enabled: false

db-scheduler:
  table-name: platform.scheduled_tasks
  # Start polling only when the application is ready, not while beans are still being created.
  delay-startup-until-context-ready: true

logging:
  structured:
    # JSON to stdout (ADR 0012). MDC values (traceId, spanId, requestId) become fields of every line.
    format:
      console: ecs

server:
  # Client IP from X-Forwarded-For only when the request comes from a private-network proxy (Caddy).
  forward-headers-strategy: native

onemind:
  security:
    jwt:
      issuer: https://api.onemind.app
      audience: onemind-app
      access-token-ttl: 15m
      # Private P-256 JWK (`./gradlew generateJwtKey`); required in prod, a temporary key otherwise.
      signing-key: ${JWT_SIGNING_KEY:}
      previous-public-key: ${JWT_PREVIOUS_PUBLIC_KEY:}
  auth:
    # HMAC key for sign-in codes; required in prod, a temporary one otherwise.
    email-code-pepper: ${EMAIL_CODE_PEPPER:}
    # Apple/Google ID tokens; client IDs are comma-separated, empty = that provider is off.
    id-token:
      apple:
        jwk-set-uri: https://appleid.apple.com/auth/keys
        issuers: https://appleid.apple.com
        client-ids: ${APPLE_CLIENT_IDS:}
      google:
        jwk-set-uri: https://www.googleapis.com/oauth2/v3/certs
        issuers: https://accounts.google.com,accounts.google.com
        client-ids: ${GOOGLE_CLIENT_IDS:}
  mail:
    from: ${MAIL_FROM:OneMind <no-reply@onemind.app>}
  # Lowest supported app version per platform; older apps get 426 (ADR 0001). Empty = no check.
  app-version:
    minimum-ios: ${MIN_APP_VERSION_IOS:}
    minimum-android: ${MIN_APP_VERSION_ANDROID:}

management:
  health:
    # The SMTP provider being down must not take the backend out of rotation.
    mail:
      enabled: false
  tracing:
    # No exporter yet: spans only provide traceId/spanId for logs and error responses, so sample all.
    sampling:
      probability: 1.0
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
