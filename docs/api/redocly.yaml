# Spec lint config (ADR 0001). Run from the repo root:
#   npx @redocly/cli@2.82.0 lint --config docs/api/redocly.yaml docs/api/openapi.yaml
plugins:
  - ./lint/money-plugin.js
extends:
  - recommended
rules:
  # Shared components are defined ahead of the first endpoints; turn back on once paths use them.
  no-unused-components: off
  # Private API, no public license.
  info-license: off
  # AGENTS.md rule 5: money is the Money object, int64 minor units or a decimal string, never a JSON
  # number. Word lists in lint/money-words.json; proven by lint/money-as-number.yaml (CI, api job).
  onemind/money-minor-units: error
