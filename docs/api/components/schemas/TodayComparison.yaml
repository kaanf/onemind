type: object
description: |
  Paid so far against the same weekday last week, up to the same local time (METRICS, periods).
required:
  - previousBusinessDay
properties:
  previousBusinessDay:
    type: string
    format: date
  previous:
    type: object
    allOf:
      - $ref: ./Money.yaml
    nullable: true
    description: Null when there is no data for that day.
  deltaPercent:
    type: string
    nullable: true
    description: One decimal, rounded half-up ("12.4", "-3.0"); null when `previous` is 0 or missing.
    example: '12.4'
