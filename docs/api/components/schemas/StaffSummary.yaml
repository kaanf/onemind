type: object
description: |
  Screen 03 for one business day. `totals` and `staff` are null when no requested venue has data **for
  that day** (`status NO_DATA_YET`: not synced yet, or the day is before its data starts); on a covered day
  without bills `staff` is an empty list and the totals are 0 (`READY`). Totals are the sums of the listed
  staff: a bill the POS sent without `createdBy` (or tips without `paidBy`) is in no one's figures.
  Staff are sorted by sales, largest first, then by name, then by staff id.
required:
  - status
  - currency
  - businessDay
  - venues
  - pendingVenueIds
  - dataGaps
properties:
  status:
    $ref: ./DataStatus.yaml
  currency:
    type: string
    pattern: '^[A-Z]{3}$'
  businessDay:
    type: string
    format: date
    description: The day shown.
  venues:
    type: array
    items:
      $ref: ./TodayVenue.yaml
  pendingVenueIds:
    type: array
    description: Requested venues without data for the day (not synced yet, or the day is before their data starts).
    items:
      type: string
      format: uuid
  totals:
    type: object
    allOf:
      - $ref: ./StaffTotals.yaml
    nullable: true
  staff:
    type: array
    nullable: true
    items:
      $ref: ./StaffSales.yaml
  dataGaps:
    $ref: ./DataGaps.yaml
