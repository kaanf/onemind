# Proves onemind/money-minor-units (redocly.yaml, money-plugin.js) bites: CI expects exactly the
# problems listed in money-as-number.expected.
# Not referenced from openapi.yaml, so the normal spec lint never reads it.
openapi: 3.0.3
info:
  title: Money lint fixture
  version: 0.0.0
servers:
  - url: https://example.invalid/api/v1
security: []
paths:
  /fixture:
    get:
      operationId: getFixture
      summary: Fixture
      description: Fixture
      tags: [fixture]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Fixture'
        '400':
          description: Bad request
  /price:
    get:
      operationId: getPrice
      summary: Price
      description: A money-named component used directly as a body.
      tags: [fixture]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Price'
        '400':
          description: Bad request
tags:
  - name: fixture
    description: Fixture
components:
  schemas:
    Money:
      type: object
      required: [amountMinor, currency]
      properties:
        amountMinor:
          type: integer
          format: int64
        currency:
          type: string
    # Violation: a money-named component as a JSON number, whatever name or body it is used under.
    Price:
      type: number
    # Self-referencing array and map: the rule stops instead of recursing forever.
    Tree:
      type: array
      items:
        $ref: '#/components/schemas/Tree'
    MapTree:
      type: object
      additionalProperties:
        $ref: '#/components/schemas/MapTree'
    Fixture:
      type: object
      properties:
        # Violations: money as a JSON number, or an integer that isn't int64.
        totalPrice:
          type: number
          format: double
        amountMinor:
          type: number
        net_revenue:
          type: number
          format: float
        tip:
          type: integer
          format: int32
        lossMinor:
          type: integer
        tips:
          type: number
        subtotal:
          type: number
        averageBill:
          type: number
        refunds:
          type: number
          format: double
        prices:
          type: array
          items:
            type: number
        costsMinor:
          type: array
          items:
            type: integer
            format: int32
        totalsByDay:
          type: object
          additionalProperties:
            type: number
        # Items are a relative $ref inside the other file, resolved against that file.
        crossFilePrices:
          $ref: './money-as-number-shared.yaml#/Amounts'
        # Allowed: the Money object, int64 minor units, a sub-minor decimal string, ratios, counts and words that only contain a money token.
        revenue:
          $ref: '#/components/schemas/Money'
        costMinor:
          type: integer
          format: int64
        costPerServing:
          type: string
          example: '0.6000'
        discountRate:
          type: string
        discountPercent:
          type: number
        tipShare:
          type: number
        totalCount:
          type: integer
          format: int32
        multiple:
          type: number
        revenueByHour:
          type: array
          items:
            type: integer
            format: int64
        hasDiscount:
          type: boolean
        tooltipOffset:
          type: number
        guestCounts:
          type: array
          items:
            type: number
        costume:
          type: number
        # Price is reported at its definition, not again here.
        unitValue:
          $ref: '#/components/schemas/Price'
        revenueByVenue:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/Money'
        sharedCosts:
          $ref: './money-as-number-shared.yaml#/MinorAmounts'
        priceTree:
          $ref: '#/components/schemas/Tree'
        costTree:
          $ref: '#/components/schemas/MapTree'
        # Identifiers and plural not-money suffixes are not money.
        billNumber:
          type: integer
          format: int32
        paymentIds:
          type: array
          items:
            type: number
        priceIndex:
          type: number
        tipRates:
          type: number
        discountPercents:
          type: array
          items:
            type: number
