openapi: 3.0.3
info:
  title: OneMind API
  version: 1.0.0
  description: |
    Back-office API for the OneMind mobile app. Conventions: `docs/api/README.md` (ADR 0010).
    Inside `/api/v1` changes are additive only (ADR 0001).
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - name: Auth
    description: Sign-in and tokens (ADR 0004).
  - name: Me
    description: The signed-in user's own account.
  - name: Onboarding
    description: Interim demo onboarding (dev/demo only) until the Storyous connection exists (P15).
  - name: Dashboard
    description: Screen-shaped reads of POS figures (docs/domain/METRICS.md).
paths:
  /auth/email/start:
    $ref: ./paths/account/auth-email-start.yaml
  /auth/email/verify:
    $ref: ./paths/account/auth-email-verify.yaml
  /auth/apple:
    $ref: ./paths/account/auth-apple.yaml
  /auth/google:
    $ref: ./paths/account/auth-google.yaml
  /auth/refresh:
    $ref: ./paths/account/auth-refresh.yaml
  /auth/logout:
    $ref: ./paths/account/auth-logout.yaml
  /me:
    $ref: ./paths/account/me.yaml
  /onboarding/demo-places:
    $ref: ./paths/onboarding/demo-places.yaml
  /onboarding/demo:
    $ref: ./paths/onboarding/demo.yaml
  /dashboard/today:
    $ref: ./paths/dashboard/today.yaml
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access JWT, 15 min (ADR 0004).
  schemas:
    Problem:
      $ref: ./components/schemas/Problem.yaml
    FieldError:
      $ref: ./components/schemas/FieldError.yaml
    Money:
      $ref: ./components/schemas/Money.yaml
    AppleSignInRequest:
      $ref: ./components/schemas/AppleSignInRequest.yaml
    AuthTokens:
      $ref: ./components/schemas/AuthTokens.yaml
    EmailCodeStartRequest:
      $ref: ./components/schemas/EmailCodeStartRequest.yaml
    EmailCodeVerifyRequest:
      $ref: ./components/schemas/EmailCodeVerifyRequest.yaml
    GoogleSignInRequest:
      $ref: ./components/schemas/GoogleSignInRequest.yaml
    RefreshTokenRequest:
      $ref: ./components/schemas/RefreshTokenRequest.yaml
  parameters:
    IdempotencyKey:
      $ref: ./components/parameters/IdempotencyKey.yaml
    AppVersion:
      $ref: ./components/parameters/AppVersion.yaml
    Platform:
      $ref: ./components/parameters/Platform.yaml
    VenueId:
      $ref: ./components/parameters/VenueId.yaml
    VenueIds:
      $ref: ./components/parameters/VenueIds.yaml
  responses:
    BadRequest:
      $ref: ./components/responses/BadRequest.yaml
    Unauthorized:
      $ref: ./components/responses/Unauthorized.yaml
    Forbidden:
      $ref: ./components/responses/Forbidden.yaml
    NotFound:
      $ref: ./components/responses/NotFound.yaml
    Conflict:
      $ref: ./components/responses/Conflict.yaml
    UnprocessableEntity:
      $ref: ./components/responses/UnprocessableEntity.yaml
    UpgradeRequired:
      $ref: ./components/responses/UpgradeRequired.yaml
    TooManyRequests:
      $ref: ./components/responses/TooManyRequests.yaml
